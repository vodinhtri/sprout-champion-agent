<svg width="1280" height="720" viewBox="0 0 680 383" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Momentum 16:9 thumbnail — dark Apple Pro style</title>
<desc>A premium near-black Apple "Pro" style thumbnail: Momentum logo and a short headline on the left, and a floating dark to-do app card with circular checkboxes and a minimal forecast sparkline on the right, lit by a subtle indigo glow.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0b0b0e"/><stop offset="100%" stop-color="#18191d"/>
</linearGradient>
<radialGradient id="bloom" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#6e6cf0" stop-opacity="0.20"/><stop offset="100%" stop-color="#6e6cf0" stop-opacity="0"/>
</radialGradient>
<radialGradient id="bloom2" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#22d3ee" stop-opacity="0.10"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
</radialGradient>
<linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#8a88f2"/><stop offset="100%" stop-color="#5d5be6"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="680" height="383" fill="url(#bg)"/>
<circle cx="520" cy="120" r="220" fill="url(#bloom)"/>
<circle cx="120" cy="330" r="180" fill="url(#bloom2)"/>

