<text x="96" y="85" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif" font-size="18" font-weight="600" fill="#f5f5f7">Momentum</text>

<text x="55" y="180" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif" font-size="33" font-weight="600" fill="#f5f5f7" letter-spacing="-0.5">To-dos that</text>
<text x="55" y="220" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif" font-size="33" font-weight="600" fill="#f5f5f7" letter-spacing="-0.5">write themselves.</text>
<text x="56" y="252" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif" font-size="15" fill="#a1a1a6">From real news &amp; markets, every morning.</text>
