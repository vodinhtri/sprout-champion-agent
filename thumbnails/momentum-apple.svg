<text x="408" y="286" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif" font-size="12" fill="#86868b">Forecast</text>
<text x="608" y="286" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif" font-size="12" font-weight="600" fill="#34c759">▲ 18%</text>
<path d="M408 313 L440 310 L472 311 L504 305 L536 306 L568 301 L600 299" fill="none" stroke="#5e5ce6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="600" cy="299" r="3" fill="#5e5ce6"/>

<rect x="56" y="64" width="30" height="30" rx="9" fill="url(#mark)"/>
