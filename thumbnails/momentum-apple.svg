<svg width="1280" height="720" viewBox="0 0 680 383" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Momentum 16:9 thumbnail — Apple style</title>
<desc>A clean, light Apple-style thumbnail: Momentum logo and a short headline on the left, and a floating white to-do app card with circular checkboxes and a minimal forecast sparkline on the right.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#fcfcfe"/><stop offset="100%" stop-color="#eceef3"/>
</linearGradient>
<radialGradient id="accent" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#5e5ce6" stop-opacity="0.10"/><stop offset="100%" stop-color="#5e5ce6" stop-opacity="0"/>
</radialGradient>
<linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#6e6ce8"/><stop offset="100%" stop-color="#4f4dd1"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="680" height="383" fill="url(#bg)"/>
<circle cx="540" cy="120" r="200" fill="url(#accent)"/>

<rect x="372" y="80" width="272" height="258" rx="28" fill="#1b1b38" fill-opacity="0.04"/>
<rect x="380" y="74" width="256" height="258" rx="26" fill="#1b1b38" fill-opacity="0.05"/>
<rect x="384" y="64" width="248" height="256" rx="22" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/>

