<text x="608" y="147" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif" font-size="12" fill="#30d158">+5.2%</text>
<line x1="440" y1="165" x2="608" y2="165" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

<circle cx="419" cy="190" r="11" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
