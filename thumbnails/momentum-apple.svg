<text x="608" y="147" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif" font-size="12" fill="#34c759">+5.2%</text>
<line x1="440" y1="165" x2="608" y2="165" stroke="#f1f1f4" stroke-width="1"/>

