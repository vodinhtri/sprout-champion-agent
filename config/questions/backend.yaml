questions:
  - id: be-001
    topic: backend
    difficulty: junior
    question: "REST API là gì? Giải thích các HTTP methods phổ biến (GET, POST, PUT, PATCH, DELETE)."
    follow_ups:
      - "Idempotent method là gì?"
    evaluation_criteria:
      - "Resource-oriented design"
      - "Correct method semantics"
      - "Idempotency awareness"
    sample_good_points:
      - "Status codes (200, 201, 404, 500)"

  - id: be-002
    topic: backend
    difficulty: mid
    question: "Giải thích database indexing. Khi nào index giúp và khi nào index có thể gây hại?"
    follow_ups:
      - "Composite index hoạt động thế nào?"
    evaluation_criteria:
      - "B-tree / hash index basics"
      - "Read vs write trade-off"
      - "Covering index, selective columns"
    sample_good_points:
      - "EXPLAIN ANALYZE"
      - "Over-indexing on write-heavy tables"

  - id: be-003
    topic: backend
    difficulty: mid
    question: "Caching strategies: cache-aside vs write-through vs write-behind. Khi nào dùng từng loại?"
    follow_ups:
      - "Cache invalidation strategies?"
    evaluation_criteria:
      - "Correct pattern descriptions"
      - "Consistency vs performance trade-offs"
      - "TTL, stampede prevention"
    sample_good_points:
      - "Redis use cases"
      - "Cache warming"

  - id: be-004
    topic: backend
    difficulty: senior
    question: "Thiết kế API rate limiting cho hệ thống public API. Các approach và trade-offs?"
    follow_ups:
      - "Distributed rate limiting với nhiều instances?"
    evaluation_criteria:
      - "Token bucket / sliding window"
      - "Per-user vs per-IP vs per-key"
      - "Redis / centralized store for distributed"
    sample_good_points:
      - "429 response + Retry-After header"
      - "Graceful degradation"

  - id: be-005
    topic: backend
    difficulty: junior
    question: "SQL JOIN là gì? Phân biệt INNER JOIN và LEFT JOIN."
    follow_ups:
      - "Khi nào dùng EXISTS thay vì JOIN?"
    evaluation_criteria:
      - "Correct join semantics"
      - "Practical query examples"
    sample_good_points:
      - "N+1 query problem awareness"

  - id: be-006
    topic: backend
    difficulty: senior
    question: "Giải thích ACID trong database transactions. CAP theorem liên quan thế nào?"
    follow_ups:
      - "Eventual consistency trong distributed systems?"
    evaluation_criteria:
      - "Atomicity, Consistency, Isolation, Durability"
      - "CAP: pick 2 of 3 in partitions"
      - "Practical examples (bank transfer, inventory)"
    sample_good_points:
      - "Isolation levels (READ COMMITTED, SERIALIZABLE)"
