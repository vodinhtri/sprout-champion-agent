<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Technical Interview Agent</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --user: #1e3a5f;
      --bot: #1a2332;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 1.1rem; }
    header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.85rem; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      align-self: center;
      background: #3f1d1d;
      border: 1px solid #7f1d1d;
      color: #fecaca;
      max-width: 95%;
    }
    .msg.loading { color: var(--muted); font-style: italic; }
    form {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    button {
      padding: 0 1.1rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint {
      padding: 0 1rem 0.75rem;
      color: var(--muted);
      font-size: 0.8rem;
      background: var(--panel);
    }
  </style>
</head>
<body>
  <header>
    <h1>Technical Interview Agent</h1>
    <p>Mock phỏng vấn FE / BE / System Design — mỗi lần gửi = một lượt hội thoại</p>
  </header>
  <div id="messages"></div>
  <p class="hint">Gợi ý: "Tôi muốn phỏng vấn frontend, level mid" · "Cho câu tiếp theo" · "Kết thúc và tổng kết"</p>
  <form id="chat-form">
    <textarea id="input" rows="2" placeholder="Nhập câu trả lời hoặc yêu cầu..." required></textarea>
    <button type="submit" id="send-btn">Gửi</button>
  </form>
  <script>
    const STORAGE_SESSION = "interview_session_id";
    const STORAGE_USER = "interview_user_id";

    function uid(prefix) {
      return prefix + "-" + crypto.randomUUID();
    }

    function getSessionId() {
      let id = localStorage.getItem(STORAGE_SESSION);
      if (!id) {
        id = uid("session");
        localStorage.setItem(STORAGE_SESSION, id);
      }
      return id;
    }

    function getUserId() {
      let id = localStorage.getItem(STORAGE_USER);
      if (!id) {
        id = uid("candidate");
        localStorage.setItem(STORAGE_USER, id);
      }
      return id;
    }

    function newSession() {
      localStorage.setItem(STORAGE_SESSION, uid("session"));
      document.getElementById("messages").innerHTML = "";
      appendMessage("bot", "Session mới. Bạn muốn phỏng vấn chủ đề nào? (frontend / backend / system_design) và level? (junior / mid / senior)");
    }

    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    async function sendMessage(text) {
      appendMessage("user", text);
      const loading = appendMessage("bot loading", "Đang suy nghĩ...");
      sendBtn.disabled = true;

      try {
        const res = await fetch("/invocations", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-GreenNode-AgentBase-Session-Id": getSessionId(),
            "X-GreenNode-AgentBase-User-Id": getUserId(),
          },
          body: JSON.stringify({ message: text }),
        });

        const data = await res.json();
        loading.remove();

        if (data.status === "success" && data.response) {
          appendMessage("bot", data.response);
        } else {
          appendMessage("error", data.error || data.message || JSON.stringify(data));
        }
      } catch (err) {
        loading.remove();
        appendMessage("error", "Lỗi kết nối: " + err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendMessage(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    appendMessage("bot", "Xin chào! Tôi là Technical Interviewer. Bạn muốn phỏng vấn chủ đề nào? (frontend / backend / system_design) và level? (junior / mid / senior)\n\nNhấn Ctrl+Shift+N để bắt đầu session mới.");
    document.addEventListener("keydown", (e) => {
      if (e.ctrlKey && e.shiftKey && e.key === "N") newSession();
    });
  </script>
</body>
</html>
